<!DOCTYPE html>
<html lang="ja">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="ssot-sha256" content="0f60f2e1a1ec0613333f24d5856cbbc23e93d54ce34d4d7798613efd6aa771e9">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="ビル管爆速ドリル">
  <meta name="theme-color" content="#1e293b">
  <title>ビル管 直前爆速ワンタップドリル</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-foreground: #ffffff;
      --card: rgba(255, 255, 255, 0.98);
      --foreground: #0f172a;
      --muted-foreground: #64748b;
      --border: #e2e8f0;
      --correct: #10b981;
      --incorrect: #ef4444;
      --bg: #f1f5f9;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --card: rgba(30, 41, 59, 0.98);
        --foreground: #f8fafc;
        --muted-foreground: #94a3b8;
        --border: #334155;
        --bg: #0f172a;
      }
    }
    body {
      background-color: var(--bg);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      min-height: -webkit-fill-available;
    }
    .tap-btn {
      transition: all 0.1s cubic-bezier(0.4, 0, 0.2, 1);
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .tap-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.getRegistrations().then(registrations => {
      for (let registration of registrations) {
        registration.unregister();
      }
    });
  }
  if ('caches' in window) {
    caches.keys().then(names => {
      for (let name of names) caches.delete(name);
    });
  }
</script>
<body class="text-[var(--foreground)] antialiased p-2 sm:p-4 select-none flex flex-col justify-center items-center">
  <div class="max-w-xl mx-auto bg-[var(--card)] border border-[var(--border)] rounded-2xl p-4 sm:p-5 shadow-lg backdrop-blur-sm">
    
    <!-- ヘッダー: 科目フィルター & スコア -->
    <div class="flex items-center justify-between gap-2 pb-3 border-b border-[var(--border)]">
      <div class="flex items-center gap-2">
        <span class="text-[10px] bg-emerald-500/20 text-emerald-400 px-1.5 py-0.5 rounded font-mono font-bold">v2.2</span>
        <span id="subject-badge" class="px-2.5 py-1 rounded-lg text-xs font-bold bg-blue-500/10 text-blue-500 border border-blue-500/20">
          全科目
        </span>
        <select id="category-select" onchange="changeCategory(this.value)" class="text-xs bg-transparent border border-[var(--border)] rounded-lg px-2 py-1 text-[var(--foreground)] outline-none cursor-pointer">
          <option value="all">全科目ランダム (100問)</option>
          <option value="ねずみ・昆虫等の防除">🐭 ねずみ・昆虫 (22問)</option>
          <option value="建築物の構造概論">🏗️ 建築構造 (15問)</option>
          <option value="空気環境の調整">🌬️ 空気環境 (15問)</option>
          <option value="建築物衛生行政概論">🏛️ 衛生行政 (14問)</option>
          <option value="給水及び排水の管理">🚰 給水・排水 (13問)</option>
          <option value="建築物の環境衛生">🌡️ 環境衛生 (11問)</option>
          <option value="清掃">🧹 清掃 (10問)</option>
          <option value="review">🔥 ミス問題のみ復習</option>
        </select>
      </div>

      <!-- スコア・ストリーク -->
      <div class="flex items-center gap-3 text-xs font-mono">
        <div class="flex items-center gap-1 text-emerald-500 font-bold" title="正解数">
          <span>⭕</span><span id="stat-correct">0</span>
        </div>
        <div class="flex items-center gap-1 text-rose-500 font-bold" title="不正解数">
          <span>❌</span><span id="stat-wrong">0</span>
        </div>
        <div class="flex items-center gap-1 text-amber-500 font-bold" title="連続正解ストリーク">
          <span>🔥</span><span id="stat-streak">0</span>
        </div>
      </div>
    </div>

    <!-- 進捗バー -->
    <div class="w-full bg-[var(--border)] h-1.5 rounded-full overflow-hidden mt-2.5">
      <div id="progress-bar" class="bg-blue-500 h-full w-0 transition-all duration-300"></div>
    </div>

    <!-- 問題表示カード -->
    <div class="my-4 min-h-[140px] flex flex-col justify-center">
      <div class="flex items-center justify-between text-xs text-[var(--muted-foreground)] mb-1">
        <span id="q-counter" class="font-bold">第 1 問 / 100</span>
        <span id="q-source" class="opacity-70">チートシート</span>
      </div>
      <p id="q-text" class="text-sm sm:text-base font-semibold leading-relaxed text-[var(--foreground)] mt-1">
        問題読み込み中...
      </p>
    </div>

    <!-- 回答前：特大ワンタップ ○ × ボタン -->
    <div id="action-buttons" class="grid grid-cols-2 gap-3 sm:gap-4 my-2">
      <button onclick="handleAnswer(true)" class="tap-btn flex items-center justify-center gap-2 py-3.5 sm:py-4 px-4 rounded-xl bg-emerald-500/10 hover:bg-emerald-500/20 active:bg-emerald-500/30 text-emerald-500 border-2 border-emerald-500/30 font-bold text-lg sm:text-xl shadow-sm cursor-pointer">
        <span class="text-2xl sm:text-3xl leading-none">⭕</span>
        <span>正しい (O)</span>
      </button>
      <button onclick="handleAnswer(false)" class="tap-btn flex items-center justify-center gap-2 py-3.5 sm:py-4 px-4 rounded-xl bg-rose-500/10 hover:bg-rose-500/20 active:bg-rose-500/30 text-rose-500 border-2 border-rose-500/30 font-bold text-lg sm:text-xl shadow-sm cursor-pointer">
        <span class="text-2xl sm:text-3xl leading-none">❌</span>
        <span>誤り (X)</span>
      </button>
    </div>

    <!-- 回答後：判定＆要点解説パネル（初期非表示） -->
    <div id="result-panel" class="hidden my-2 space-y-3">
      <div id="result-banner" class="flex items-center justify-between p-3 rounded-xl font-bold text-sm sm:text-base">
        <span id="result-status">⭕ 正解！</span>
        <span id="result-user-ans" class="text-xs font-normal opacity-80"></span>
      </div>
      <div class="p-3.5 rounded-xl bg-[var(--border)]/30 border border-[var(--border)] text-xs sm:text-sm text-[var(--foreground)] leading-relaxed">
        <div class="font-bold text-blue-500 mb-1 flex items-center gap-1">
          <span>💡 ひっかけ急所解説</span>
        </div>
        <div id="result-explanation"></div>
      </div>
      <button id="btn-next" onclick="nextQuestion()" class="tap-btn w-full py-3 px-4 rounded-xl bg-blue-600 hover:bg-blue-700 active:bg-blue-800 text-white font-bold text-sm sm:text-base shadow-md cursor-pointer flex items-center justify-center gap-2">
        <span>次の問題へ (Space / Enter)</span>
        <span>➔</span>
      </button>
    </div>

    <!-- フッター: 操作キーヘルプ -->
    <div class="flex items-center justify-between text-[11px] text-[var(--muted-foreground)] pt-3 border-t border-[var(--border)] mt-3">
      <span>PC操作: [O/X] または [←/→] で回答、[Space/Enter] で次へ</span>
      <button onclick="toggleAutoNext()" id="auto-next-btn" class="px-2 py-0.5 rounded text-[10px] border border-[var(--border)] hover:bg-[var(--border)]/50 transition">
        自動次へ: OFF
      </button>
    </div>

  </div>

  <script>
    const allQuestions = [{"id": "BS-PST-001", "subject": "ねずみ・昆虫等の防除", "question": "チャバネゴキブリは、産卵した卵鞘（らんしょう）を壁の隙間やくぼみに粘着物質で産み付け、成虫・幼虫ともに飛翔してビル内を拡散する。", "answer": false, "explanation": "【×】チャバネゴキブリは卵鞘を「孵化直前までメスの尾端に付着させて持ち歩く」（産み付けるのはクロゴキブリ等）。また、翅はあるが「飛翔しない」！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q1 [引用: 【チャバネゴキブリ】<br体長・卵鞘（ら...]"}, {"id": "BS-PST-002", "subject": "ねずみ・昆虫等の防除", "question": "ヤマトゴキブリは日本の在来種であり、寒さに強く、東北や関東地方の屋外（樹皮下など）でも越冬できる。", "answer": true, "explanation": "【○】正しい。ヤマトゴキブリは寒さに強く、屋外で越冬可能。一方、チャバネゴキブリやワモンゴキブリは寒さに弱く、暖房されたビル内等で通年活動する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q2 [引用: 東北や関東の屋外（樹皮下等）でも越冬でき...]"}, {"id": "BS-PST-003", "subject": "ねずみ・昆虫等の防除", "question": "ゴキブリは完全変態を行う昆虫であり、幼虫と成虫では生活場所や食性が全く異なる。", "answer": false, "explanation": "【×】ゴキブリは「不完全変態」（卵➔幼虫➔成虫、蛹［さなぎ］の時期がない）。幼虫と成虫は同じ場所で活動し、同じ食物を食べる（常に雑食性）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q3 [引用: また幼虫と成虫で生息場所や食性は変わるか...]"}, {"id": "BS-PST-004", "subject": "ねずみ・昆虫等の防除", "question": "ゴキブリの集合フェロモンは直腸（糞中）から分泌され、排泄物によって形成される黒褐色の汚れをローチスポットという。", "answer": true, "explanation": "【○】正しい。集合フェロモンは直腸（糞）から分泌される（気門からではない）。また、ゴキブリには警戒フェロモンは存在しない。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q4 [引用: 【ゴキブリのフェロモンと集団効果】<br...]"}, {"id": "BS-PST-005", "subject": "ねずみ・昆虫等の防除", "question": "室内塵中に最も多く生息するヒョウヒダニ類（ヤケヒョウヒダニ等）は、人を刺して体液を吸血し、発疹熱を媒介する。", "answer": false, "explanation": "【×】ヒョウヒダニ類は人を「刺さない・吸血しない」。虫体や糞が小児喘息やアトピー性皮膚炎の主要な「アレルゲン」となる。吸血し発疹熱を媒介するのはイエダニ。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q8 [引用: ・ヒョウヒダニ類（刺咬❌・吸血❌）：室内...]"}, {"id": "BS-PST-006", "subject": "ねずみ・昆虫等の防除", "question": "ツメダニ類は、ヒョウヒダニやコナダニなどを捕食するダニであり、まれに人を誤って刺咬して体液を吸うが、吸血や感染症媒介はしない。", "answer": true, "explanation": "【○】正しい。ツメダニは捕食性ダニで、ヒョウヒダニやチャタテムシが大発生すると増殖し、人を刺咬する（吸血・病原体媒介はしない）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q9 [引用: 吸血や感染症媒介はしない...]"}, {"id": "BS-PST-007", "subject": "ねずみ・昆虫等の防除", "question": "トコジラミ（ナンキンムシ）は、夜間に幼虫および雌雄成虫のすべてが吸血するが、人への感染症を媒介することはない。", "answer": true, "explanation": "【○】正しい。トコジラミは激しい掻痒感を引き起こすが、感染症を媒介しない（媒介能力が確認されていない）。近年ピレスロイド抵抗性が深刻。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q12 [引用: 【トコジラミ】<br分類（何目か）・変態...]"}, {"id": "BS-PST-008", "subject": "ねずみ・昆虫等の防除", "question": "ネコノミは不完全変態であり、幼虫・成虫ともに宿主から吸血して生活する。", "answer": false, "explanation": "【×】ネコノミは「完全変態」（卵➔幼虫➔蛹➔成虫）。吸血するのは「成虫のみ」で、幼虫は成虫の糞や有機物粉屑を食べて育ち吸血しない！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q13 [引用: 幼虫・雌雄成虫とも吸血...]"}, {"id": "BS-PST-009", "subject": "ねずみ・昆虫等の防除", "question": "コロモジラミは不完全変態であり、幼虫・成虫ともに吸血し、発疹チフスや塹壕熱を媒介する。", "answer": true, "explanation": "【○】正しい。シラミ類は不完全変態で幼虫・雌雄成虫とも吸血する。コロモジラミは下着や衣服に寄生し、発疹チフスを媒介する（飢餓に弱い）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q13 [引用: 発疹チフスを媒介...]"}, {"id": "BS-PST-010", "subject": "ねずみ・昆虫等の防除", "question": "チカイエカはビルの地下水槽や湧水槽から発生し、成虫は越冬のために吸血を行わなければ初回の産卵ができない。", "answer": false, "explanation": "【×】チカイエカは休眠せずビル地下で通年発生し、「初回の産卵を吸血なしで行える（無吸血産卵）」。また感染症は一切媒介しない。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q14 [引用: 【蚊：チカイエカ vs アカイエカ】<b...]"}, {"id": "BS-PST-011", "subject": "ねずみ・昆虫等の防除", "question": "ヒトスジシマカは昼行性で空き缶や古タイヤ等の小型人工容器から発生し、成虫ではなく「卵」で越冬する。", "answer": true, "explanation": "【○】正しい。ヒトスジシマカは昼行性（ヤブカ）、卵で越冬（成虫は冬に死滅）。デング熱・ジカ熱・チクングニア熱を媒介する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q15 [引用: 雌成虫のみで越冬...]"}, {"id": "BS-PST-012", "subject": "ねずみ・昆虫等の防除", "question": "ドブネズミは身軽で垂直登攀や綱渡りを得意とし、ビルの天井裏や上層階を主な営巣場所とする。", "answer": false, "explanation": "【×】これは「クマネズミ」の特徴！ドブネズミは大型で泳ぎが得意、下水溝や地下室・厨房土間などビル下層階を好む（登攀は苦手）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q17 [引用: 【浄化槽の蚊防除】<br通気管の防虫網は...]"}, {"id": "BS-PST-013", "subject": "ねずみ・昆虫等の防除", "question": "クマネズミの糞は両端が尖った細長い紡錘形で、動き回りながら排泄するため散乱していることが多い。", "answer": true, "explanation": "【○】正しい。クマネズミ＝紡錘形・散乱。ドブネズミ＝ソーセージ形・まとまって排泄。ハツカネズミ＝米粒形。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q17 [引用: 浄化機能を低下させるため...]"}, {"id": "BS-PST-014", "subject": "ねずみ・昆虫等の防除", "question": "昆虫成長制御剤（IGR）は、成虫に対する即効的なノックダウン効果が高く、害虫成虫の駆除に多用される。", "answer": false, "explanation": "【×】IGR（昆虫成長制御剤：キチン合成阻害剤や幼若ホルモン様物質）は、幼虫の脱皮や変態を阻害する薬剤であり、すでに完成した「成虫には即効性も殺虫効果もない」。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q29 [引用: ノックダウン後に蘇生あり...]"}, {"id": "BS-PST-015", "subject": "ねずみ・昆虫等の防除", "question": "生息密度調査において、ゴキブリ指数は「捕獲総数 ÷ （トラップ数 × 設置日数）」で求められる。", "answer": true, "explanation": "【○】正しい。1トラップ1日あたりの捕獲数を示す。幼虫も成虫もすべて捕獲総数にカウントする。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q5 [引用: 【計算公式】<br「ゴキブリ指数」と「防...]"}, {"id": "BS-STR-016", "subject": "建築物の構造概論", "question": "CFT構造（コンクリート充填鋼管構造）は、鋼管が内部コンクリートを拘束（コンファインド効果）し、コンクリートが鋼管の局部座屈を防止するため、高い耐力と変形性能を持つ。", "answer": true, "explanation": "【○】正しい。CFT構造はお互いの弱点を補い合う理想的な構造で、耐震性・変形能力・耐火性に極めて優れ、超高層ビルに多用される。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q41 [引用: 【アルベドと遮熱性塗料】<br①アルベド...]"}, {"id": "BS-STR-017", "subject": "建築物の構造概論", "question": "耐震構造は、積層ゴムやダンパーにより建物を地盤から絶縁し、大地震時の建物の揺れそのものを大幅に低減する構造である。", "answer": false, "explanation": "【×】これは「免震構造」の説明！耐震構造は柱や梁の「強度と粘り」で倒壊を防ぐ構造であり、地震の揺れそのものは減らず、室内の什器倒壊等は起きやすい。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q43 [引用: 【建築士法と工事監理】<br①一級建築士...]"}, {"id": "BS-STR-018", "subject": "建築物の構造概論", "question": "鉄骨構造（S造）は、自重が軽量で大スパン架構に適し、部材の粘り強さが大きいが、熱に弱いため耐火被覆が必要であり、圧縮材の座屈に注意が必要である。", "answer": true, "explanation": "【○】正しい。S造の3大キーワード：①軽量で大空間可能、②粘り強いが座屈しやすい、③約500℃で耐力半減するため耐火被覆必須。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q37 [引用: 【ストリートキャニオン・サンクンガーデン...]"}, {"id": "BS-STR-019", "subject": "建築物の構造概論", "question": "積載荷重の大きさの順序は、同一床面積において「事務室 ＞ 住宅の居室 ＞ 百貨店・店舗の売場」である。", "answer": false, "explanation": "【×】順序は「店舗の売場（約3,000 N/m²） ＞ 事務室（約2,900 N/m²） ＞ 住宅の居室（約1,800 N/m²）」！不特定多数の客が集まる売場が最大。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q46 [引用: 【地盤現象・調査・基礎】<br①砂質地盤...]"}, {"id": "BS-STR-020", "subject": "建築物の構造概論", "question": "構造計算に用いる積載荷重の大きさは、同一室において「床の構造計算用」よりも「地震力を計算する場合の積載荷重」の方が大きく設定されている。", "answer": false, "explanation": "【×】逆！積載荷重の大きさの順序は「床の計算用（大） ＞ 大梁・柱・基礎用（中） ＞ 地震力計算用（小）」！地震力計算用が最も小さくなる（2025年問97、2023年問97で毎年必出）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q47 [引用: ③部位別（3部位）（床・大梁柱基礎・地震...]"}, {"id": "BS-STR-021", "subject": "建築物の構造概論", "question": "液状化現象は、地下水位が低く、粘土分の多い固く締まった粘性土地盤において最も発生しやすい。", "answer": false, "explanation": "【×】液状化は「地下水位が高く、粒径のそろったゆるい砂質地盤（飽和砂地盤）」で地震動により間隙水圧が上昇して発生する！粘性土では発生しにくい。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q48 [引用: また「地震力計算用」で逆転する組合せは...]"}, {"id": "BS-STR-022", "subject": "建築物の構造概論", "question": "耐火建築物において、11階以上の高層階の防火区画は、原則として床面積100m²以内（スプリンクラー等設置時は200m²以内）ごとに区画しなければならない。", "answer": true, "explanation": "【○】正しい。11階以上（高層区画）は100m²以内（令第112条）。一般階の面積区画は1,500m²以内（スプリンクラー設置時は3,000m²以内）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q53 [引用: 【RC構造：施工用語と耐用年数（4用途順...]"}, {"id": "BS-STR-023", "subject": "建築物の構造概論", "question": "コンクリートの中性化とは、大気中の二酸化炭素（CO2）がコンクリート内部に浸入し、アルカリ性から酸性へと変化してコンクリート強度が急激にゼロになる現象である。", "answer": false, "explanation": "【×】中性化はアルカリ性（pH12〜13）から「中性（pH8.5〜10程度）」に低下する現象。中性化してもコンクリート自体の強度は低下しないが、内部の「鉄筋が錆びて膨張・爆裂」する！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q50 [引用: クリープ＝持続荷重で時間とともにひずみが...]"}, {"id": "BS-STR-024", "subject": "建築物の構造概論", "question": "木材は、繊維方向と直交する方向（年輪接線方向や放射方向）よりも、繊維方向（幹の長さ方向）の引張強度が著しく大きい。", "answer": true, "explanation": "【○】正しい。木材は強い異方性があり、繊維方向の引張・圧縮強度が最も大きく、直交方向（繊維と直角）の強度は非常に小さい。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q56 [引用: 【建築材料：金属・左官・陶磁器（4種順）...]"}, {"id": "BS-ADM-025", "subject": "建築物衛生行政概論", "question": "建築物環境衛生管理基準に従事する登録事業において、パートやアルバイト従業員は「年1回以上の従事者研修」の受講対象外である。", "answer": false, "explanation": "【×】雇用形態（正社員・パート・アルバイト）を問わず、業務に従事する者「全員」が年1回以上の研修受講対象となる！", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q1 [引用: 登録事業に従事する「パート・アルバイト従...]"}, {"id": "BS-ADM-026", "subject": "建築物衛生行政概論", "question": "特定建築物の建築物環境衛生管理技術者は、建築物清掃業などの登録営業所における監督者（統括管理者等）を兼務することができる。", "answer": false, "explanation": "【×】兼務不可！①特定建築物の管理技術者と登録営業所の監督者、②2以上の営業所の監督者、③同一営業所での2以上の登録事業の監督者はすべて兼務禁止。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q2 [引用: 1. 特定建築物の 「建築物環境衛生管理...]"}, {"id": "BS-ADM-027", "subject": "建築物衛生行政概論", "question": "学校教育法第1条に規定する学校（小学校・中学校・高校等）であっても、延べ面積が8,000m²以上であれば建築物衛生法の「特定建築物」に該当する。", "answer": true, "explanation": "【○】正しい。学校教育法第1条の学校は延べ面積「8,000m²以上」で特定建築物。百貨店・オフィス・旅館等は「3,000m²以上」。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q69 [引用: 憲法25条（3分野））と...]"}, {"id": "BS-ADM-028", "subject": "建築物衛生行政概論", "question": "特定建築物が国の機関（国・地方公共団体）の保有する施設である場合、都道府県知事は改善命令や立入検査を行うことができる。", "answer": false, "explanation": "【×】国の機関等の特例により、改善命令・立入検査・使用停止・罰則は適用除外！都道府県知事は「説明要求」または「勧告」のみ行える。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q3 [引用: 【物的要件】<br登録8事業のうち...]"}, {"id": "BS-ADM-029", "subject": "建築物衛生行政概論", "question": "特定建築物の所有者等は、特定建築物に該当することとなった日から「1ヶ月以内」に、都道府県知事等に届け出なければならない。", "answer": true, "explanation": "【○】正しい。使用開始の日から1ヶ月以内（届出事項の変更も1ヶ月以内）。保健所設置市では市長、特別区では区長へ届出。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q71 [引用: 【地域保健法（保健所）】<br保健所の所...]"}, {"id": "BS-ADM-030", "subject": "建築物衛生行政概論", "question": "建築物環境衛生管理技術者免状は、厚生労働大臣が交付し、不正な手段で免状を取得した場合は免状の返納を命ずることができる。", "answer": true, "explanation": "【○】正しい。免状の交付・返納命令・取消しは「厚生労働大臣」の権限である（知事ではない）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q72 [引用: 都道府県＝予防計画）...]"}, {"id": "BS-ADM-031", "subject": "建築物衛生行政概論", "question": "水道法における「専用水道」とは、寄宿舎や社宅等で100人を超える居住者に給水するもの、または一日最大給水量20m³を超える自家用水道をいう。", "answer": true, "explanation": "【○】正しい。専用水道の定義：居住者100人超、または1日最大給水量20m³超。水道事業から受水する受水槽式で口径・水槽基準を満たすものも含む。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q134 [引用: ・専用水道 ＝ 100人を超える居住者に...]"}, {"id": "BS-ADM-032", "subject": "建築物衛生行政概論", "question": "特定建築物の帳簿書類（空気環境測定記録、受水槽点検記録等）の保存期間は、すべて一律「3年間」と定められている。", "answer": false, "explanation": "【×】建築物衛生法における帳簿書類の保存期間は「5年間」である！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q76 [引用: 【届出と帳簿書類】<br①特定建築物の届...]"}, {"id": "BS-ENV-033", "subject": "建築物の環境衛生", "question": "電磁波において、紫外線（UV）は赤外線（IR）に比べて波長が短く、光子1個あたりのエネルギーが大きい。", "answer": true, "explanation": "【○】正しい。波長順：γ線＜X線＜紫外線＜可視光＜赤外線＜マイクロ波。波長が短いほど振動数が高く、エネルギーが大きい！", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q30 [引用: 【単位①】<br湿り空気の「比熱」と「比...]"}, {"id": "BS-ENV-034", "subject": "建築物の環境衛生", "question": "紫外線の中でUV-C（波長200〜280nm）は殺菌作用が最も強いが、地表には太陽光からはほとんど到達せず、成層圏のオゾン層で吸収される。", "answer": true, "explanation": "【○】正しい。UV-Cはオゾン層で吸収されるため殺菌灯等で人工的に利用される。地表に届くのはUV-Aと一部のUV-B（紅斑・皮膚がん原因）。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q31 [引用: （2025-問46）...]"}, {"id": "BS-ENV-035", "subject": "建築物の環境衛生", "question": "電離放射線（α線、β線、γ線、X線、中性子線）のうち、α線は透過力が非常に強く、鉛の板でなければ遮蔽できない。", "answer": false, "explanation": "【×】α線（ヘリウム原子核）は透過力が最も弱く、「紙1枚」や数cmの空気で止まる！透過力が強く鉛や厚いコンクリートが必要なのは「γ線」や「X線」。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q33 [引用: 壁体の中空層内面に「アルミ箔」を貼ると...]"}, {"id": "BS-ENV-036", "subject": "建築物の環境衛生", "question": "温熱要素における「PMV（予測平均温冷感申告）」は、人間の温冷感を＋3（非常に暑い）から−3（非常に寒い）の7段階で評価する指標である。", "answer": true, "explanation": "【○】正しい。PMV＝0が快適。PMVとPPD（予測不満足者率）は対応しており、PMV=0のときでもPPDは5%（不満足者ゼロにはならない）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q95 [引用: 【PMV・PPD・WBGT】<br①PM...]"}, {"id": "BS-ENV-037", "subject": "建築物の環境衛生", "question": "等価騒音レベルLeqは、時間とともに変動する騒音レベルの瞬時値の単純算術平均値である。", "answer": false, "explanation": "【×】単純算術平均ではない！変動する騒音の「エネルギー的な時間平均値（自乗平均平方根に基づく対数平均値）」である。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q98 [引用: ②呼気中の \text{CO}2 濃度は...]"}, {"id": "BS-ENV-038", "subject": "建築物の環境衛生", "question": "WBGT（湿球黒球温度）は熱中症予防の指標であり、屋外（日射あり）では「自然湿球温度 0.7 ＋ 黒球温度 0.2 ＋ 乾球温度 0.1」の加重平均で算出する。", "answer": true, "explanation": "【○】正しい。日射あり：湿球0.7＋黒球0.2＋乾球0.1。室内・日射なし：湿球0.7＋黒球0.3（乾球なし）。いずれも湿球温度の重みが7割と最大！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q97 [引用: 【過敏性肺炎（2種）】<br「夏型過敏性...]"}, {"id": "BS-AIR-039", "subject": "空気環境の調整", "question": "光散乱式デジタル粉じん計による浮遊粉じん測定では、あらかじめ標準粒子等で校正された質量濃度変換係数（K値）を用いれば、粉じんの性状や測定場所が変わっても同一のK値を用いてよい。", "answer": false, "explanation": "【×】K値は粉じんの種類・粒径・形状・反射率等によって異なるため、測定場所や浮遊粉じんの性状ごとに「質量濃度測定法（ろ過捕集法等）」と並行測定して求めなければならない！", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q45 [引用: 冬期暖房時に室内の相対湿度が低下しすぎる...]"}, {"id": "BS-AIR-040", "subject": "空気環境の調整", "question": "非分散赤外線吸収法（NDIR）は、一酸化炭素（CO）および二酸化炭素（CO2）の測定器として広く用いられており、赤外線の特定波長における分子の光吸収特性を利用している。", "answer": true, "explanation": "【○】正しい。COおよびCO2ともにNDIR測定器が環境衛生管理基準の測定器として認められている。COには定電位電解法も用いられる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q114 [引用: 【物理単位：音・振動・光・照明（問46必...]"}, {"id": "BS-AIR-041", "subject": "空気環境の調整", "question": "第2種機械換気方式は、給気機と排気機の双方を機械ファンで強制運転する方式であり、最も確実な換気風量制御が行える。", "answer": false, "explanation": "【×】これは「第1種換気」！第2種換気は「給気のみ機械、排気は自然開口」であり、室内が正圧（陽圧）に保たれるためクリーンルームや無菌室に用いられる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q117 [引用: 【熱放射と材料の放射特性（4種）】...]"}, {"id": "BS-AIR-042", "subject": "空気環境の調整", "question": "空気調和設備における全熱交換器は、排気から「顕熱」のみを回収し、「潜熱（水分）」の交換は行わない熱回収装置である。", "answer": false, "explanation": "【×】全熱交換器は「顕熱（温度）」と「潜熱（湿度・水分）」の『両方』を同時に回収・交換する装置！顕熱のみを回収するのは「顕熱交換器（プレート式等）」。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q120 [引用: 【室内気流と置換換気】<br①吹出気流と...]"}, {"id": "BS-AIR-043", "subject": "空気環境の調整", "question": "ビル管理基準における空気環境基準値では、ホルムアルデヒドの量は「0.08 ppm以下（または 0.1 mg/m³以下）」と規定されている。", "answer": true, "explanation": "【○】正しい。新築・大規模改修後の直近6〜9月の間に1回測定。基準値は0.08 ppm（0.1 mg/m³）以下。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q112 [引用: ・ホルムアルデヒド：精密＝DNPH捕集-...]"}, {"id": "BS-AIR-044", "subject": "空気環境の調整", "question": "乾湿球湿度計において、相対湿度が100%（飽和状態）のとき、乾球温度、湿球温度、露点温度の3つの値はすべて一致する。", "answer": true, "explanation": "【○】正しい。相対湿度100%では水分がこれ以上蒸発しないため、乾球温度＝湿球温度＝露点温度となる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q123 [引用: これらを組み合わせても相対湿度は求まらな...]"}, {"id": "BS-AIR-045", "subject": "空気環境の調整", "question": "気流の測定には、指向性がなく低風速（0.5 m/s以下）でも正確に測定できる「熱線風速計（アネモマスター等）」が適している。", "answer": true, "explanation": "【○】正しい。ビル管理基準の気流（0.5 m/s以下）測定には微風速を無指向性で測定できる熱線風速計（白金線等の冷却効果を利用）が指定されている。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q115 [引用: Q115. 【空気汚染物質の単位（4種）...]"}, {"id": "BS-WTR-046", "subject": "給水及び排水の管理", "question": "飲料水系統の配管が、冷却塔の補給水配管や雑用水配管と直接バルブを介して接続されている配管接続（クロスコネクション）は、逆流防止弁（逆止弁）を設置していれば認められる。", "answer": false, "explanation": "【×】クロスコネクションは「いかなるバルブ・逆流防止弁を介しても絶対に禁止」！完全な「吐水口空間（エアギャップ）」による物理的絶縁が必要。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q135 [引用: 【給水栓末端の残留塩素基準（2段階）】<...]"}, {"id": "BS-WTR-047", "subject": "給水及び排水の管理", "question": "バキュームブレーカ（真空破壊弁）は、給水管内が大気圧より高圧になったときに作動して水を逃がす安全弁である。", "answer": false, "explanation": "【×】バキュームブレーカは、給水管内が「負圧（大気圧未満・真空）」になった瞬間に外気（空気）を取り入れてサイホン作用を断ち切り、汚水の逆流（逆サイホン作用）を防止する器具！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q136 [引用: またトリハロメタンが増える条件は...]"}, {"id": "BS-WTR-048", "subject": "給水及び排水の管理", "question": "受水槽の点検口（マンホール）は、有効内径60cm以上とし、槽上面から10cm以上の立ち上がりを設けなければならない。", "answer": true, "explanation": "【○】正しい。数字の鉄板暗記：有効径「60cm以上」、立ち上がり「10cm以上」。また水槽周囲空間は「6面点検：周囲60cm以上、上部100cm以上」。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q137 [引用: Q137. 【水質検査の周期（3区分）】...]"}, {"id": "BS-WTR-049", "subject": "給水及び排水の管理", "question": "受水槽のオーバーフロー管および通気管の先端には、外部からの害虫侵入を防ぐため、防虫網（10メッシュ程度）を取り付ける。", "answer": false, "explanation": "【×】メッシュ数が誤り！防虫網は「40メッシュ以上（ステンレス等）」でなければ微小害虫（チョウバエ・ユスリカ等）を防げない。10メッシュは網目が粗すぎる！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q138 [引用: 【貯水槽清掃と消毒】<br貯水槽の清掃頻...]"}, {"id": "BS-WTR-050", "subject": "給水及び排水の管理", "question": "排水トラップの封水深（シール深さ）は、日本産業規格（JIS）および建築基準法施行令等により、原則として「50mm以上100mm以下」と規定されている。", "answer": true, "explanation": "【○】正しい。50mm未満は破封しやすく臭気侵入、100mm超は自浄作用が低下し汚物が堆積・閉塞しやすくなる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q140 [引用: 【施設別の設計給水量（8施設）と必要水圧...]"}, {"id": "BS-WTR-051", "subject": "給水及び排水の管理", "question": "伸頂通気方式において、伸頂通気管の管径は、排水立て管の管径よりも小さく縮小して屋上に立ち上げることができる。", "answer": false, "explanation": "【×】伸頂通気管の管径は「排水立て管の管径以上（同一径）」とし、絶対に縮小してはならない！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q143 [引用: 【中央式給湯設備の配管・防食】<br①均...]"}, {"id": "BS-WTR-052", "subject": "給水及び排水の管理", "question": "結合通気管は、高層建築物のブランチ間隔10以下ごとに、排水立て管と通気立て管を接続して排水立て管内の圧力変動を緩和する管である。", "answer": true, "explanation": "【○】正しい。高層排水立て管の圧力緩和のため、最上階から数えてブランチ間隔10以内ごとに設ける。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q148 [引用: ④結合通気管はどこを接続するか...]"}, {"id": "BS-CLN-053", "subject": "清掃", "question": "リノリウム床材は、亜麻仁油や松脂等の天然原料から作られており、アルカリ性洗剤に対して極めて強い耐性を持っている。", "answer": false, "explanation": "【×】リノリウムはアルカリに「極めて弱い（アルカリで黄変・脆化・加水分解する）」！必ず中性洗剤を使用し、水気も嫌うため湿気管理が必須。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q152 [引用: 【浄化槽の処理フロー（5工程）・高度処理...]"}, {"id": "BS-CLN-054", "subject": "清掃", "question": "塩化ビニル系床タイル（プラスチック系床材）は、耐水性・耐摩耗性・耐薬品性に優れ、日常の水拭きや樹脂ワックスの塗布管理に適している。", "answer": true, "explanation": "【○】正しい。ビルで最も多用される塩ビ系床材は酸・アルカリ・水に強いが、熱や有機溶剤（シンナー等）には弱い。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q151 [引用: 生物処理に適する...]"}, {"id": "BS-CLN-055", "subject": "清掃", "question": "産業廃棄物管理票（マニフェスト）制度において、排出事業者が最終処分終了を確認する「E票」は、マニフェスト交付日から原則として180日以内に返送されなければならない。", "answer": true, "explanation": "【○】正しい。B2票（運搬終了）・D票（中間処理終了）は「90日以内（特別管理は60日）」、E票（最終処分終了）は「180日以内」。マニフェスト保存は5年間！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q157 [引用: 【床材（6種）の性質と禁忌（毎年必出）】...]"}, {"id": "BS-CLN-056", "subject": "清掃", "question": "床用樹脂ワックスの剥離作業（ハクリ）には、ワックス被膜のポリマーを溶解・分解するため、強力な酸性洗剤が使用される。", "answer": false, "explanation": "【×】樹脂ワックスの被膜を溶解・剥離するのは「アルカリ性（pH11〜13程度）」の剥離剤！酸性洗剤はトイレの尿石除去やタイルの水垢落とし等に使う。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q154 [引用: 【清掃の作業手順書（記載4項目 vs 除...]"}, {"id": "BS-CLN-057", "subject": "清掃", "question": "界面活性剤のうち、逆性石けん（陽イオン［カチオン］界面活性剤）は、強い殺菌・消毒作用を持つが、通常の石けん（陰イオン界面活性剤）と混合すると互いの効力を打ち消し合って失効する。", "answer": true, "explanation": "【○】正しい。カチオン（＋）とアニオン（−）が結合して水に不溶性の沈殿を生じ、殺菌力も洗浄力も消失する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q155 [引用: 【清掃機器とダストコントロール法】<br...]"}, {"id": "BS-PST-058", "subject": "ねずみ・昆虫等の防除", "question": "急性殺鼠剤（リン化亜鉛等）は、ネズミに連続して数日間摂食させることで血液凝固を阻害し、内出血により死亡させる薬剤である。", "answer": false, "explanation": "【×】これは「抗凝血性（慢性）殺鼠剤（ワルファリン等）」の説明！リン化亜鉛等の急性殺鼠剤は、胃液中の酸と反応してホスフィンガスを発生し、1回の喫食で数時間〜半日以内に死に至らしめる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q33 [引用: 噴霧器（100\ \mu\text{m}...]"}, {"id": "BS-PST-059", "subject": "ねずみ・昆虫等の防除", "question": "クマネズミに対する粘着トラップ（トリモチ等）は、障害物のない部屋の中央部に広く敷き詰めて設置するのが最も捕獲効率が高い。", "answer": false, "explanation": "【×】ネズミは警戒心が強く、部屋の中央を横断することは極めて稀！必ず「壁際」「配管沿い」「物陰」など、ラットサイン（黒ずみ・糞）のある通路に沿って設置する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q23 [引用: またシバンムシに寄生して人を刺す蜂は...]"}, {"id": "BS-PST-060", "subject": "ねずみ・昆虫等の防除", "question": "チャタテムシ類は人を刺咬・吸血しないが、屋内のカビや酵母を好んで摂食し、大発生するとツメダニ等の捕食性ダニの増殖原因となる。", "answer": true, "explanation": "【○】正しい。チャタテムシ（微小な無翅・有翅昆虫）はカビを主食とし、新築のコンクリート乾燥過程や湿気の多い畳等で発生。ツメダニの餌となる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q16 [引用: [!question]- Q17. 【浄...]"}, {"id": "BS-PST-061", "subject": "ねずみ・昆虫等の防除", "question": "シバンムシ類（タバコシバンムシ等）は木造建築物の構造材や柱を食害し、建物の耐震性能を著しく低下させる木材害虫である。", "answer": false, "explanation": "【×】木材（柱等）を食害するのは「シロアリ」や「キクイムシ」！シバンムシは乾物・乾燥食品（小麦粉、乾麺、香辛料）や畳、漢方薬、書籍等を食害する食品・乾物害虫。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q16 [引用: [!question]- Q17. 【浄...]"}, {"id": "BS-PST-062", "subject": "ねずみ・昆虫等の防除", "question": "マダニ類は、幼虫・若虫・成虫のすべての発育段階において、雌雄ともに動物や人に吸血し、SFTS（重症熱性血小板減少症候群）や日本紅斑熱を媒介する。", "answer": true, "explanation": "【○】正しい。マダニは野外（草むら・山林）に生息し、全段階・雌雄ともに吸血する。SFTSウイルスやリケッチア（日本紅斑熱）を媒介。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q11 [引用: 【マダニ類】<brマダニ類の生息場所・吸...]"}, {"id": "BS-PST-063", "subject": "ねずみ・昆虫等の防除", "question": "有機リン系およびカーバメート系の殺虫剤は、昆虫の神経シナプスにおける「アセチルコリンエステラーゼ」の働きを阻害することで殺虫効果を発揮する。", "answer": true, "explanation": "【○】正しい。神経伝達物質アセチルコリンの分解を阻害し、神経興奮を持続させて死に至らしめる。有機リン中毒の解毒剤にはPAMやアトロピンが用いられる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q27 [引用: 【殺鼠剤：摂取経路と抗凝血性殺鼠剤（第1...]"}, {"id": "BS-STR-064", "subject": "建築物の構造概論", "question": "普通コンクリートの設計基準強度の判定において、圧縮強度試験用の供試体は、標準養生（20±2℃の水中文中養生）で「材齢28日」の強度を基準とする。", "answer": true, "explanation": "【○】正しい。コンクリートの標準的な設計基準強度は材齢28日（4週）の圧縮強度試験で判定する。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q115 [引用: 【都市環境①】<br①両側を高い建物で囲...]"}, {"id": "BS-STR-065", "subject": "建築物の構造概論", "question": "コンクリートのスランプ値が大きいものほど、コンクリートの流動性が低く、施工時の型枠への充填が困難になる。", "answer": false, "explanation": "【×】スランプ値（円錐コーンを外した後の沈下量 cm）が「大きい」ほど、柔らかく流動性が高い！逆にスランプが小さいと硬練りで施工しにくい。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q116 [引用: 【都市環境②（典型7公害）】<br環境基...]"}, {"id": "BS-STR-066", "subject": "建築物の構造概論", "question": "地盤調査における「標準貫入試験」で得られるN値とは、質量63.5kgのハンマーを76cm自由落下させ、サンプラーを「30cm」貫入させるのに要する打撃回数である。", "answer": true, "explanation": "【○】正しい。数値の暗記：ハンマー「63.5kg」、落下高さ「76cm」、貫入量「30cm」。N値が大きいほど固く締まった良好な地盤。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q120 [引用: ②砂質地盤と粘土質地盤で起きる現象は...]"}, {"id": "BS-STR-067", "subject": "建築物の構造概論", "question": "摩擦杭は、杭先端を固い支持地盤（岩盤や密実な砂礫層）に到達させて、主として先端の支持力によって建物の鉛直荷重を支える杭である。", "answer": false, "explanation": "【×】これは「支持杭」の説明！「摩擦杭」は、固い支持層が深くて届かない場合に、杭の側面（周面）と周囲の土との「周面摩擦力」によって荷重を支える杭。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q121 [引用: 【積載荷重（3部位・4用途）】<br①部...]"}, {"id": "BS-STR-068", "subject": "建築物の構造概論", "question": "階段やエレベーターシャフトなどの「竪穴区画」を構成する界壁や床は、耐火構造とし、開口部には特定防火設備または防火設備を設けなければならない。", "answer": true, "explanation": "【○】正しい。竪穴区画は煙の煙突効果による上階への火災延焼を防ぐため、原則として耐火構造＋防火設備で完全に区画する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q54 [引用: 【鉄骨（S）構造】<br①SDとSRの違...]"}, {"id": "BS-STR-069", "subject": "建築物の構造概論", "question": "高力ボルト摩擦接合は、ボルトの軸部が孔の内壁に接触して生じる「支圧力」と「せん断力」によって応力を伝達する接合方式である。", "answer": false, "explanation": "【×】高力ボルト摩擦接合は、強力な締め付け力により生じる鋼板相互の「接触面の摩擦力」によって応力を伝達する！孔との接触による支圧接合ではない。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q112 [引用: 【日射量の大小①】<br「南向き鉛直壁面...]"}, {"id": "BS-ADM-070", "subject": "建築物衛生行政概論", "question": "建築物環境衛生管理技術者は、厚生労働省令で定める場合（同一敷地内や近接する特定建築物で業務に支障がない場合等）を除き、原則として2以上の特定建築物の管理技術者を兼ねることはできない。", "answer": true, "explanation": "【○】正しい。原則は1特定建築物ごとに1名の選任。ただし職務遂行に支障がないと認められる場合に限り、一定条件下で兼任が認められる（兼任確認書の保管等）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q70 [引用: 環境衛生上必要な事項等を定めることにより...]"}, {"id": "BS-ADM-071", "subject": "建築物衛生行政概論", "question": "都道府県知事は、特定建築物の所有者等が建築物環境衛生管理基準に従って維持管理をしていないとき、改善命令を出すことはできるが、特定建築物の使用停止を命ずることはできない。", "answer": false, "explanation": "【×】都道府県知事は改善命令に従わない場合や著しく衛生を害するおそれがある場合、「使用の停止や制限」を命ずることができる（法第12条）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q74 [引用: 【特定建築物の要件（用途は8つ...]"}, {"id": "BS-ADM-072", "subject": "建築物衛生行政概論", "question": "労働安全衛生法に基づく一般定期健康診断は、常時使用する労働者に対して「1年以内ごとに1回」定期に行わなければならない。", "answer": true, "explanation": "【○】正しい。一般定期健診は1年ごとに1回。深夜業等の特定業務従事者は「6ヶ月以内ごとに1回」である。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q84 [引用: 【学校保健安全法】<br学校薬剤師の職務...]"}, {"id": "BS-ADM-073", "subject": "建築物衛生行政概論", "question": "感染症法において、結核や重症急性呼吸器症候群（SARS）、中東呼吸器症候群（MERS）は「二類感染症」に分類される。", "answer": true, "explanation": "【○】正しい。二類感染症：結核、SARS、MERS、鳥インフルエンザ（H5N1等）、ポリオ（急性灰白髄炎）。一類＝エボラ・ペスト等。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q82 [引用: ビル管理士免状「だけ（講習なし）」でなれ...]"}, {"id": "BS-ADM-074", "subject": "建築物衛生行政概論", "question": "特定建築物の維持管理権原者が複数存在する場合であっても、建築物環境衛生管理技術者は必ず1名のみを選任しなければならない。", "answer": false, "explanation": "【×】複数の管理権原者が共同して1名を選任することもできるが、区分所有建物等で管理権原者が複数に分かれている場合は、管理権原ごとにそれぞれ管理技術者を選任することもできる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q77 [引用: 維持管理権原者は管理技術者の意見を尊重し...]"}, {"id": "BS-ENV-075", "subject": "建築物の環境衛生", "question": "赤外線（IR）は「熱線」とも呼ばれ、物質に吸収されると分子振動を励起して熱を発生させるが、白内障（赤外線白内障）の原因となることがある。", "answer": true, "explanation": "【○】正しい。溶鉱炉やガラス工場の作業者に見られる職業病「赤外線白内障」が有名。紫外線も角膜炎（雪眼炎）や白内障の原因となる。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q32 [引用: 壁体内部の定常温度分布グラフで「温度勾配...]"}, {"id": "BS-ENV-076", "subject": "建築物の環境衛生", "question": "音の強さのレベル（音圧レベル）が同じであっても、周波数が異なると人間の耳に感じる音の大きさ（ラウドネス）は異なり、人間の耳は3,000〜4,000Hz付近の音に対して最も感度が高い。", "answer": true, "explanation": "【○】正しい。等ラウドネス曲線（フェッチャー・マンソン曲線）の基本。人間は3〜4kHz付近が最も敏感で、低周波音や超高周波音には鈍感。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q38 [引用: （2025-問57）...]"}, {"id": "BS-ENV-077", "subject": "建築物の環境衛生", "question": "騒音計の「A特性」は、人間の聴覚の周波数感度特性（特に低音域の感度低下）に近似させた補正回路であり、一般的な環境騒音測定に用いられる。", "answer": true, "explanation": "【○】正しい。騒音レベルdB(A)はA特性で重みづけされた値。C特性はほぼフラットで大音量や低周波音評価に用いられる。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q39 [引用: 吸収式冷凍機は排熱回収に適しているか...]"}, {"id": "BS-ENV-078", "subject": "建築物の環境衛生", "question": "不快指数（DI）は、気温（乾球温度）と気流（風速）の2つの要素のみを用いて計算される温熱指標である。", "answer": false, "explanation": "【×】不快指数DIは「乾球温度（気温）」と「湿球温度（湿度）」の2つのみで計算される指標！風速（気流）や放射熱は考慮されない。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q96 [引用: 【シックビル症候群と気管支喘息】<br①...]"}, {"id": "BS-ENV-079", "subject": "建築物の環境衛生", "question": "JIS照明基準において、事務室における「一般的な事務作業（キーボード操作・読書等）」の推奨照度は「300 lx以上」とされている。", "answer": true, "explanation": "【○】正しい。一般的な事務作業＝300 lx以上。精密な製図やCAD作業＝750 lx以上。廊下・階段＝50〜100 lx以上。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q103 [引用: 書類・キーボード上照度は 300\tex...]"}, {"id": "BS-AIR-080", "subject": "空気環境の調整", "question": "ビル管理基準において、空気調和設備を設けている室内の「浮遊粉じん量」の基準値は「0.15 mg/m³以下」であり、測定対象は相対沈降径が「10μm以下」の粒子である。", "answer": true, "explanation": "【○】正しい。0.15 mg/m³以下、粒径10μm以下の吸入性粉じんが対象。測定には分粒装置付き光散乱式粉じん計等を用いる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q111 [引用: 【空気環境管理基準（7項目）とワースト（...]"}, {"id": "BS-AIR-081", "subject": "空気環境の調整", "question": "ビル管理基準において、室内の「二酸化炭素（CO2）の含有率」の基準値は「5,000 ppm以下」と定められている。", "answer": false, "explanation": "【×】基準値は「1,000 ppm以下（0.1%以下）」！5,000 ppmは労働安全衛生法等の作業環境許容限界レベル（8時間曝露上限）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q111 [引用: 【空気環境管理基準（7項目）とワースト（...]"}, {"id": "BS-AIR-082", "subject": "空気環境の調整", "question": "一酸化炭素（CO）のヘモグロビンとの結合力は、酸素（O2）の約200〜300倍と極めて強く、低濃度であっても酸素運搬を阻害して内窒息を起こす。", "answer": true, "explanation": "【○】正しい。COは無色無臭・毒性が極めて強い。ビル管理基準は原則「6 ppm以下」（特例10 ppm以下）。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q113 [引用: 【物理単位：湿り空気と熱移動（問46必出...]"}, {"id": "BS-AIR-083", "subject": "空気環境の調整", "question": "超音波式加湿器は、水を振動板で微細ミストにして噴霧する方式であり、加熱を行わないためレジオネラ属菌の増殖・飛散の危険性が最も低い衛生的な加湿方式である。", "answer": false, "explanation": "【×】真逆！超音波式は非加熱で水滴（エアロゾル）をそのまま飛散させるため、水槽内にレジオネラ菌やカビが繁殖するとそのまま室内に撒き散らし「加湿器肺炎」を起こす危険が最も高い！加熱蒸気式が最も衛生的。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q126 [引用: 【蒸気圧縮冷凍サイクル（4機器）とp-h...]"}, {"id": "BS-AIR-084", "subject": "空気環境の調整", "question": "変風量（VAV）単一ダクト方式は、送風温度を一定に保ち、室負荷の変動に応じて給気風量を変化させることで室内温度を制御する省エネルギー方式である。", "answer": true, "explanation": "【○】正しい。VAV＝Variable Air Volume。負荷が少ない時は風量を絞るためファン動力を削減できる。ただし風量を絞りすぎると必要換気量不足になる点に注意。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q119 [引用: および「自然換気量 Q」の比例関係は...]"}, {"id": "BS-AIR-085", "subject": "空気環境の調整", "question": "第3種機械換気方式は、給気を自然吸気口から行い、排気のみをファンで機械排気する方式であり、室内が「負圧（陰圧）」になるため、厨房・浴室・便所等に適している。", "answer": true, "explanation": "【○】正しい。室内が負圧になるため、室内の臭気や水蒸気が他の部屋へ漏れ出さない。厨房やトイレに多用される。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q117 [引用: 【熱放射と材料の放射特性（4種）】...]"}, {"id": "BS-AIR-086", "subject": "空気環境の調整", "question": "HEPAフィルタは、定格風量で粒径0.3μmの粒子に対して「99.97%以上」の粒子捕集率を持つ高性能エアフィルタである。", "answer": true, "explanation": "【○】正しい。HEPA（High Efficiency Particulate Air filter）は0.3μmに対して99.97%以上。クリーンルームや無菌病室、高性能空気清浄機に用いられる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q125 [引用: 【空調方式（3分類）】<br①全空気方式...]"}, {"id": "BS-WTR-087", "subject": "給水及び排水の管理", "question": "給水設備の受水槽において、底面は平坦（水平勾配ゼロ）とし、水が均等に溜まるように設計しなければならない。", "answer": false, "explanation": "【×】受水槽の底面は、水抜き・清掃時に汚泥や水が完全に排水できるよう、吸込ピットや水抜口に向かって「1/100以上の水下勾配」を設けなければならない！", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q137 [引用: Q137. 【水質検査の周期（3区分）】...]"}, {"id": "BS-WTR-088", "subject": "給水及び排水の管理", "question": "中央給湯方式において、レジオネラ属菌の増殖を防止するため、給湯温度は貯湯槽で「60℃以上」、配管端末（返湯温度）で「55℃以上」を保持することが推奨される。", "answer": true, "explanation": "【○】正しい。レジオネラ菌は20〜50℃で繁殖し、60℃では短時間で死滅する。そのため給湯60℃以上・返湯55℃以上を維持する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q146 [引用: 敷地排水ますの間隔は...]"}, {"id": "BS-WTR-089", "subject": "給水及び排水の管理", "question": "大便器洗浄弁（フラッシュバルブ）の最低必要給水圧力は、一般的な洗面器や台所の水栓と同じく「30 kPa」である。", "answer": false, "explanation": "【×】フラッシュバルブは短時間に大量の水を流すため、最低必要給水圧力は「70 kPa以上（便器によっては100 kPa程度）」が必要！一般水栓の30 kPaでは作動しない。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q134 [引用: 【水道区分（3つ）と配水管動水圧】<br...]"}, {"id": "BS-WTR-090", "subject": "給水及び排水の管理", "question": "各個通気方式は、衛生器具1個ごとに通気管を接続する方式であり、トラップの破封防止効果が最も高いが配管施工コストが最も大きい。", "answer": true, "explanation": "【○】正しい。各個通気は最も確実な通気方式。器具トラップのウェア（溢流面）より高い位置で通気管を立ち上げる。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q142 [引用: 【給湯温度基準と水の物理性質】<br①レ...]"}, {"id": "BS-WTR-091", "subject": "給水及び排水の管理", "question": "排水トラップにおいて、器具から一度に大量の水が流れた際、排水管内の負圧吸引力により自分自身のトラップ内の水が吸い出されて破封する現象を「自己サイホン作用」という。", "answer": true, "explanation": "【○】正しい。Sトラップ等で満流排水となったときに自分の慣性とサイホン作用で封水を引っ張り出してしまう現象。通気管の適切な設置やPトラップ採用で防ぐ。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q141 [引用: 【給水配管の接合・腐食（3色）・ウォータ...]"}, {"id": "BS-WTR-092", "subject": "給水及び排水の管理", "question": "給水管の管内流速は、管の摩耗（エロージョン）やウォーターハンマの発生を防止するため、一般に「1.5〜2.0 m/s以下」とするのが望ましい。", "answer": true, "explanation": "【○】正しい。流速が速すぎると騒音・ウォーターハンマ・管内腐食摩耗が起きるため、上限は2.0 m/s程度に抑える。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q134 [引用: 水道本管（配水管）の最小動水圧は...]"}, {"id": "BS-CLN-093", "subject": "清掃", "question": "木質系床材（フローリング等）の日常清掃では、床面の汚れを除去するため、多量の水を撒いてモップ掛けを行う「湿式清掃」が最も適している。", "answer": false, "explanation": "【×】木質床材は水分を吸収すると「反り・膨張・目地割れ・腐食」を起こすため、水撒き清掃は厳禁！固く絞ったモップや乾式清掃（ダストモップ・真空掃除機）が基本。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q153 [引用: 日常清掃・定期清掃・臨時対応（しみ取り）...]"}, {"id": "BS-CLN-094", "subject": "清掃", "question": "病院や診療所等の医療機関から排出される「感染性廃棄物」は、廃棄物処理法において「特別管理産業廃棄物」に指定されている。", "answer": true, "explanation": "【○】正しい。注射針や血液付着物等の感染性廃棄物は特別管理産業廃棄物。バイオハザードマークを表示した密閉容器で厳格に管理される。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q158 [引用: 【カーペット（繊維3種）】<brパイル形...]"}, {"id": "BS-CLN-095", "subject": "清掃", "question": "カーペットの日常清掃において、パイルの奥深くに入り込んだ砂塵やダニの虫体・糞を除去するためには、回転ブラシ（アップライト型）付きの真空掃除機が効果的である。", "answer": true, "explanation": "【○】正しい。吸引のみのキャニスター型に比べ、ビーターバーや回転ブラシでパイルを叩き起こして奥の土砂を掻き出すアップライト型掃除機が極めて有効。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q150 [引用: ・構造と運転：底勾配は 1/15\sim...]"}, {"id": "BS-CLN-096", "subject": "清掃", "question": "トイレの便器内に付着した黄色〜茶褐色の強固な「尿石（リン酸カルシウム等）」を除去するには、アルカリ性洗剤を使用するのが最も効果的である。", "answer": false, "explanation": "【×】尿石はアルカリ性の無機カルシウム塩であるため、中和・溶解するには「酸性洗剤（塩酸やスルファミン酸配合）」を使用する！アルカリ性洗剤では落ちない。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q154 [引用: 【清掃の作業手順書（記載4項目 vs 除...]"}, {"id": "BS-CLN-097", "subject": "清掃", "question": "一般廃棄物の最終処分場における埋立処分方法のうち、廃棄物を約3m積み上げるごとに約50cmの覆土を行う「サンドイッチ方式（セル工法）」は、害虫発生や臭気拡散を防ぐのに適している。", "answer": true, "explanation": "【○】正しい。即日覆土やセル工法により、火災防止・悪臭防止・ハエ等の発生防止を図る。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q159 [引用: ②事業系一般廃棄物（4種） vs 産業廃...]"}, {"id": "BS-ADM-098", "subject": "建築物衛生行政概論", "question": "建築基準法における「特殊建築物」には、共同住宅（マンション）や寄宿舎が含まれる。", "answer": true, "explanation": "【○】正しい。建築基準法別表第1の特殊建築物には、ホテル・旅館、学校、病院、百貨店に加えて「共同住宅・寄宿舎・下宿」も含まれる（※建築物衛生法の特定建築物にはマンションは含まれないので混同注意！）。", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q13 [引用: WHO憲章の前文（健康の（3側面）・差別...]"}, {"id": "BS-AIR-099", "subject": "空気環境の調整", "question": "シックハウス症候群の原因物質となるVOC（揮発性有機化合物）のうち、厚生労働省が室内濃度指針値を策定しているトルエンの指針値は、キシレンよりも厳しい数値となっている。", "answer": false, "explanation": "【×】トルエンの指針値は「260 μg/m³（0.07 ppm）」、キシレンの指針値は「200 μg/m³（0.04 ppm）」であり、キシレンの方が指針値が厳しい（低い）！", "source": "cheat_sheet:直前4日間_3大優先ターゲット＋建築構造_完全攻略シート.md#Q48 [引用: 蒸気圧縮式冷凍機の冷媒循環順序と...]"}, {"id": "BS-PST-100", "subject": "ねずみ・昆虫等の防除", "question": "ハエ類の幼虫（ウジ）は水中で生活し、成虫になると蛹（さなぎ）を経ずに羽化する不完全変態の昆虫である。", "answer": false, "explanation": "【×】ハエ類は「卵 ➔ 幼虫（ウジ） ➔ 蛹（囲蛹） ➔ 成虫」の完全変態である！蛹の時期を経て羽化する。", "source": "cheat_sheet:直前対策チートシート_一問一答（答え隠し版）.md#Q14 [引用: 【蚊：チカイエカ vs アカイエカ】<b...]"}];
    let currentQuestions = [...allQuestions];
    let currentIndex = 0;
    let stats = { correct: 0, wrong: 0, streak: 0 };
    let wrongQuestionIds = new Set();
    let autoNext = false;
    let autoNextTimer = null;
    let isAnswered = false;

    // シャッフル
    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function changeCategory(cat) {
      clearTimeout(autoNextTimer);
      if (cat === 'all') {
        currentQuestions = shuffle([...allQuestions]);
      } else if (cat === 'review') {
        currentQuestions = allQuestions.filter(q => wrongQuestionIds.has(q.id));
        if (currentQuestions.length === 0) {
          alert('現在、間違えた問題（ミス記録）はありません！全問正解中です👏');
          document.getElementById('category-select').value = 'all';
          currentQuestions = shuffle([...allQuestions]);
        } else {
          currentQuestions = shuffle(currentQuestions);
        }
      } else {
        // 正式名称・略称どちらでも確実にヒットするマッチング
        currentQuestions = shuffle(allQuestions.filter(q => {
          if (!q.subject) return false;
          return q.subject === cat || q.subject.includes(cat) || cat.includes(q.subject);
        }));
      }
      currentIndex = 0;
      loadQuestion();
    }

    function loadQuestion() {
      if (currentIndex >= currentQuestions.length) {
        // 一周終了
        showFinish();
        return;
      }
      isAnswered = false;
      const q = currentQuestions[currentIndex];
      document.getElementById('q-counter').textContent = `第 ${currentIndex + 1} 問 / ${currentQuestions.length}`;
      document.getElementById('subject-badge').textContent = q.subject;
      document.getElementById('q-source').textContent = q.source || '頻出';
      document.getElementById('q-text').textContent = q.question;

      // 進捗バー
      const pct = (currentIndex / currentQuestions.length) * 100;
      document.getElementById('progress-bar').style.width = pct + '%';

      // UIリセット
      document.getElementById('action-buttons').classList.remove('hidden');
      document.getElementById('result-panel').classList.add('hidden');
    }

    function handleAnswer(userChoice) {
      if (isAnswered) return;
      isAnswered = true;
      clearTimeout(autoNextTimer);

      const q = currentQuestions[currentIndex];
      const isCorrect = (userChoice === q.answer);

      const resultBanner = document.getElementById('result-banner');
      const resultStatus = document.getElementById('result-status');
      const resultUserAns = document.getElementById('result-user-ans');
      const resultExp = document.getElementById('result-explanation');

      if (isCorrect) {
        stats.correct++;
        stats.streak++;
        resultBanner.className = 'flex items-center justify-between p-3 rounded-xl font-bold text-sm sm:text-base bg-emerald-500/15 text-emerald-500 border border-emerald-500/30';
        resultStatus.textContent = '⭕ 正解！お見事！';
        resultUserAns.textContent = `あなたの回答: ${userChoice ? '○ 正しい' : '× 誤り'}`;
      } else {
        stats.wrong++;
        stats.streak = 0;
        wrongQuestionIds.add(q.id);
        resultBanner.className = 'flex items-center justify-between p-3 rounded-xl font-bold text-sm sm:text-base bg-rose-500/15 text-rose-500 border border-rose-500/30';
        resultStatus.textContent = '❌ 不正解！ひっかけ注意！';
        resultUserAns.textContent = `正解は 【${q.answer ? '○ 正しい' : '× 誤り'}】 です`;
      }

      // スコア更新
      document.getElementById('stat-correct').textContent = stats.correct;
      document.getElementById('stat-wrong').textContent = stats.wrong;
      document.getElementById('stat-streak').textContent = stats.streak;

      // 解説表示
      resultExp.textContent = q.explanation;

      // ボタン切り替え
      document.getElementById('action-buttons').classList.add('hidden');
      document.getElementById('result-panel').classList.remove('hidden');

      // 自動送り
      if (autoNext) {
        autoNextTimer = setTimeout(() => {
          nextQuestion();
        }, isCorrect ? 1400 : 3000);
      }
    }

    function nextQuestion() {
      clearTimeout(autoNextTimer);
      currentIndex++;
      loadQuestion();
    }

    function toggleAutoNext() {
      autoNext = !autoNext;
      const btn = document.getElementById('auto-next-btn');
      btn.textContent = autoNext ? '自動次へ: ON (1.4s)' : '自動次へ: OFF';
      btn.className = autoNext 
        ? 'px-2 py-0.5 rounded text-[10px] bg-blue-500 text-white font-bold transition'
        : 'px-2 py-0.5 rounded text-[10px] border border-[var(--border)] hover:bg-[var(--border)]/50 transition';
    }

    function showFinish() {
      document.getElementById('progress-bar').style.width = '100%';
      const rate = Math.round((stats.correct / (stats.correct + stats.wrong || 1)) * 100);
      document.getElementById('q-text').innerHTML = `
        <div class="text-center py-2">
          <div class="text-3xl mb-1">🎉 演習完了！</div>
          <div class="text-base font-bold text-blue-500">正答率: ${rate}% (${stats.correct} / ${stats.correct + stats.wrong}問)</div>
          <div class="text-xs text-[var(--muted-foreground)] mt-2">間違えた問題: ${wrongQuestionIds.size}問</div>
        </div>
      `;
      document.getElementById('action-buttons').classList.add('hidden');
      document.getElementById('result-panel').classList.remove('hidden');
      document.getElementById('result-banner').classList.add('hidden');
      document.getElementById('result-explanation').innerHTML = `
        <button onclick="restartDrill()" class="w-full py-2.5 rounded-lg bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-sm shadow">
          もう一度シャッフルして再挑戦 🔄
        </button>
      `;
      document.getElementById('btn-next').classList.add('hidden');
    }

    function restartDrill() {
      stats = { correct: 0, wrong: 0, streak: 0 };
      document.getElementById('stat-correct').textContent = '0';
      document.getElementById('stat-wrong').textContent = '0';
      document.getElementById('stat-streak').textContent = '0';
      document.getElementById('btn-next').classList.remove('hidden');
      document.getElementById('result-banner').classList.remove('hidden');
      changeCategory(document.getElementById('category-select').value);
    }

    // キーボード操作対応
    window.addEventListener('keydown', (e) => {
      const key = e.key.toLowerCase();
      if (!isAnswered) {
        if (key === 'o' || key === '1' || key === 'arrowleft') {
          e.preventDefault();
          handleAnswer(true);
        } else if (key === 'x' || key === '2' || key === 'arrowright') {
          e.preventDefault();
          handleAnswer(false);
        }
      } else {
        if (key === ' ' || key === 'enter' || key === 'arrowright' || key === 'arrowdown') {
          e.preventDefault();
          if (currentIndex < currentQuestions.length) {
            nextQuestion();
          }
        }
      }
    });

    // 初期化
    currentQuestions = shuffle([...allQuestions]);
    loadQuestion();
  </script>
</body>
</html>
